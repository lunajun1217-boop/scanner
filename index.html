<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a68ff">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scanner">
<meta name="mobile-web-app-capable" content="yes">
<title>Seriennummer-Scanner</title>
<style>
  :root{
    --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --muted:#8a8a8e;
    --line:#e5e5ea; --field:#f7f7f9; --blue:#0a68ff; --green:#1eaa50;
    --red:#e0322b; --amber:#c26a00; --chip:#eef2f9;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000000; --card:#1c1c1e; --text:#f2f2f7; --muted:#98989f;
      --line:#2c2c2e; --field:#2c2c2e; --blue:#4c9aff; --green:#32d074;
      --red:#ff6961; --amber:#f0a33a; --chip:#2c2c2e;
      --shadow:0 1px 3px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#000000; --card:#1c1c1e; --text:#f2f2f7; --muted:#98989f;
    --line:#2c2c2e; --field:#2c2c2e; --blue:#4c9aff; --green:#32d074;
    --red:#ff6961; --amber:#f0a33a; --chip:#2c2c2e;
    --shadow:0 1px 3px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  body{
    margin:0 auto;background:var(--bg);color:var(--text);
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom));
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    font-size:15px;line-height:1.45;max-width:680px;
  }
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
  .htitle{flex:1;min-width:0}
  h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.3px;white-space:nowrap}
  .sub{font-size:12px;color:var(--muted);margin:1px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:380px){ h1{font-size:17px} .sub{font-size:11px} }
  .lang{display:flex;background:var(--chip);border-radius:10px;padding:2px;flex:0 0 auto}
  .lang button{border:none;background:transparent;color:var(--muted);font-weight:700;font-size:12px;
    padding:6px 10px;border-radius:8px;cursor:pointer;letter-spacing:.3px}
  .lang button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.15)}

  .card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:13px;box-shadow:var(--shadow)}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 5px}
  input,select{width:100%;padding:11px 12px;font-size:16px;color:var(--text);
    background:var(--field);border:1px solid var(--line);border-radius:11px;font-family:inherit}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .row{display:flex;gap:9px;align-items:flex-end}
  .row>div{flex:1;min-width:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  button.b{border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;width:100%}
  button.b:active{opacity:.75}
  .b-blue{background:var(--blue)}
  .b-green{background:var(--green)}
  button.b-ghost{background:var(--chip);color:var(--text)}
  button.b-red{background:var(--red)}
  button:disabled{opacity:.45;cursor:default}
  .big{font-size:17px;padding:17px}

  .seg{display:flex;background:var(--chip);border-radius:11px;padding:3px;gap:2px}
  .seg button{flex:1;border:none;background:transparent;color:var(--muted);font-weight:700;
    font-size:13px;padding:9px 4px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}

  .stat{display:flex;gap:9px;margin-bottom:13px}
  .stat div{flex:1;background:var(--card);border-radius:14px;padding:11px;text-align:center;box-shadow:var(--shadow)}
  .stat .k{font-size:11px;color:var(--muted);font-weight:700}
  .stat .v{font-size:21px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums}

  .item{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--card);
    border-radius:13px;margin-bottom:7px;box-shadow:var(--shadow)}
  .item .no{flex:0 0 auto;min-width:26px;text-align:right;font-size:12px;color:var(--muted);
    font-weight:800;font-variant-numeric:tabular-nums}
  .item .t{flex:1;min-width:0}
  .item .sn{font-weight:700;font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    word-break:break-all;letter-spacing:.2px}
  .item .meta{font-size:11px;color:var(--muted);margin-top:2px}
  .item .meta b{color:var(--amber);font-weight:700}
  .item .x{flex:0 0 auto;background:none;border:none;color:var(--muted);font-size:17px;cursor:pointer;padding:3px 5px}
  .item.dup{border:1px solid var(--amber)}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 10px}
  .note{font-size:11.5px;color:var(--muted);margin:8px 2px 0;line-height:1.55}

  /* ---------- scanner overlay ---------- */
  .scan{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column}
  .scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  .mask{position:absolute;inset:0;pointer-events:none}
  .mask .dim{display:none}
  /* one cut-out instead of two bands, so the window can be a strip for a
     barcode, a square for a QR code or a box for text without extra panels */
  .win{position:absolute;border:2px solid rgba(255,255,255,.9);border-radius:10px;
    box-shadow:0 0 0 100vmax rgba(0,0,0,.62)}
  .win i{position:absolute;left:8px;right:8px;top:50%;height:2px;background:var(--red);
    box-shadow:0 0 8px rgba(224,50,43,.9);transform:translateY(-1px)}
  .win.box i{display:none}
  .modeseg{position:relative;z-index:3;margin:0 0 10px;display:flex;
    background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:3px}
  .modeseg button{flex:1;border:none;background:transparent;color:rgba(255,255,255,.75);
    font-weight:700;font-size:13px;padding:9px 4px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .modeseg button.on{background:#fff;color:#000}
  .shoot{background:#fff;border:none;color:#000;border-radius:12px;padding:14px;
    font-size:15px;font-weight:800;cursor:pointer;width:100%;margin-bottom:10px}
  .shoot:disabled{opacity:.5}
  .scan .bar{position:relative;z-index:2;display:flex;align-items:center;gap:9px;
    padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
  .scan .bar .sp{flex:1}
  .icb{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.25);color:#fff;
    border-radius:11px;padding:9px 12px;font-size:14px;font-weight:700;cursor:pointer}
  .icb.on{background:#fff;color:#000}
  .scan .foot{position:relative;z-index:2;margin-top:auto;
    padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.75) 30%)}
  .scan .hint{color:#fff;font-size:13px;text-align:center;margin:0 0 10px;text-shadow:0 1px 3px #000}
  .scan .last{color:#7dffa8;font-size:15px;font-weight:800;text-align:center;margin:0 0 10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;min-height:20px;text-shadow:0 1px 3px #000}
  .scan .cnt{color:#fff;font-size:12px;text-align:center;margin:0 0 10px;opacity:.85}
  .zoomrow{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .zoomrow span{color:#fff;font-size:12px;font-weight:700;opacity:.85}
  .zoomrow input[type=range]{flex:1;width:auto;padding:0;background:transparent;border:none}
  .dupbox{position:relative;z-index:3;margin:0 14px 11px;background:var(--amber);color:#fff;
    border-radius:13px;padding:12px;font-size:13.5px;font-weight:700}
  .dupbox .g{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
  .dupbox button{border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:800;cursor:pointer}
  .dupbox .yes{background:#fff;color:var(--amber)}
  .dupbox .no{background:rgba(0,0,0,.28);color:#fff}

  .updbar{position:sticky;top:calc(6px + env(safe-area-inset-top));z-index:60;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--blue);color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:12px;
    font-size:12.5px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.28)}
  .updbar b{font-variant-numeric:tabular-nums}
  .updbar button{flex:0 0 auto;background:#fff;color:var(--blue);border:none;border-radius:9px;
    padding:8px 13px;font-size:12.5px;font-weight:800;cursor:pointer}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:#111;color:#fff;padding:11px 17px;border-radius:12px;font-size:13.5px;font-weight:600;
    opacity:0;pointer-events:none;transition:.22s;z-index:200;max-width:88vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  /* ---- Hersteller / product line on each row ---- */
  .item .prod{display:inline-flex;align-items:center;gap:4px;margin-top:3px;background:var(--chip);
    border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800;color:var(--text);
    max-width:100%;line-height:1.5}
  .item .prod.guess{color:var(--muted);font-weight:700}
  .item .prod.none{background:none;padding:2px 0;color:var(--muted);font-weight:600}
  .item .prod .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .t{cursor:pointer}
  /* ---- product editor ---- */
  .modal{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.5);display:flex;
    align-items:flex-end;justify-content:center}
  .modal-in{background:var(--card);width:100%;max-width:620px;border-radius:18px 18px 0 0;
    padding:16px 15px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto}
  .modal-in h3{margin:0 0 3px;font-size:15px}
  .modal-sn{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
    color:var(--muted);word-break:break-all;margin-bottom:12px}
  .modal-in input[type=text]{width:100%;box-sizing:border-box}
  .pchips{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 3px}
  .pchips button{background:var(--chip);border:1px solid var(--line);border-radius:999px;
    padding:7px 12px;font-size:12px;font-weight:700;color:var(--text);cursor:pointer}
  .pchips button:active{opacity:.65}
  .pchips button .vd{font-weight:800;color:var(--blue);margin-left:5px;font-size:11px}
  .pchips button .fx{font-weight:800;color:var(--amber);margin-left:5px;font-size:11px}
  .pchips button.top{border-color:var(--blue);background:var(--card)}
  .rawtext{background:var(--field);border:1px solid var(--line);border-radius:11px;
    padding:10px 12px;font-size:12px;line-height:1.5;color:var(--muted);max-height:120px;
    overflow-y:auto;white-space:pre-wrap;word-break:break-all;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  /* keep a toast off the editor buttons while it is open */
  body.editing .toast{bottom:auto;top:calc(12px + env(safe-area-inset-top))}
  .verbox{text-align:center;margin-top:12px}
  .verbox span{display:inline-block;background:var(--chip);color:var(--text);border-radius:999px;
    padding:5px 13px;font-size:11.5px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .tiny{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.6;margin:14px 0 0}
  details.card summary{font-weight:700;font-size:14px;cursor:pointer;list-style:none}
  details.card summary::-webkit-details-marker{display:none}
  details.card summary:before{content:"▸ ";color:var(--muted)}
  details.card[open] summary:before{content:"▾ "}
</style>
</head>
<body>
<div class="updbar" id="updBar" hidden>
  <span><span data-i18n="upd.msg"></span> <b id="updVer"></b></span>
  <button data-i18n="upd.btn" onclick="doUpdate()"></button>
</div>

<header>
  <div class="htitle">
    <h1 data-i18n="app.title"></h1>
    <p class="sub" data-i18n="app.sub"></p>
  </div>
  <div class="lang">
    <button id="langKo" onclick="setLang('ko')">KO</button>
    <button id="langDe" onclick="setLang('de')">DE</button>
  </div>
</header>

<div class="stat">
  <div><div class="k" data-i18n="st.total"></div><div class="v" id="stTotal">0</div></div>
  <div><div class="k" data-i18n="st.today"></div><div class="v" id="stToday">0</div></div>
  <div><div class="k" data-i18n="st.dup"></div><div class="v" id="stDup">0</div></div>
</div>

<button class="b b-blue big" id="btnScan" data-i18n="btn.scan" onclick="openScan()"></button>
<p class="note" id="camNote" hidden></p>

<div class="card" style="margin-top:13px">
  <label data-i18n="f.manual"></label>
  <div class="row">
    <div><input id="manualIn" autocapitalize="characters" autocomplete="off" spellcheck="false"
      data-i18n-ph="ph.manual" onkeydown="if(event.key==='Enter')addManual()"></div>
    <button class="b b-ghost" style="flex:0 0 auto;width:auto;padding:11px 16px"
      data-i18n="btn.add" onclick="addManual()"></button>
  </div>
  <p class="note" data-i18n="note.manual"></p>
</div>

<details class="card" id="setBox">
  <summary data-i18n="set.title"></summary>

  <div style="margin-top:12px">
    <label data-i18n="set.trim"></label>
    <div class="seg" id="segTrim"></div>
    <p class="note" id="trimEx"></p>
  </div>

  <div style="margin-top:12px">
    <label data-i18n="set.swap"></label>
    <div class="seg" id="segSwap"></div>
    <p class="note" data-i18n="note.swap"></p>
  </div>

  <div style="margin-top:12px">
    <label data-i18n="set.dup"></label>
    <div class="seg" id="segDup"></div>
  </div>

  <div style="margin-top:12px">
    <label data-i18n="set.band"></label>
    <div class="seg" id="segBand"></div>
    <p class="note" data-i18n="note.band"></p>
  </div>

  <div style="margin-top:12px">
    <label data-i18n="set.beep"></label>
    <div class="seg" id="segBeep"></div>
  </div>

  <button class="b b-ghost" style="margin-top:13px" data-i18n="btn.reapply" onclick="reapply()"></button>
  <p class="note" data-i18n="note.reapply"></p>
</details>

<div style="display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 9px">
  <label style="margin:0" data-i18n="list.title"></label>
  <span class="note" style="margin:0" id="listInfo"></span>
</div>
<div id="list"></div>

<div class="grid2" style="margin-top:13px">
  <button class="b b-green" data-i18n="btn.xlsx" onclick="exportXlsx()"></button>
  <button class="b b-ghost" data-i18n="btn.csv" onclick="exportCsv()"></button>
</div>
<button class="b b-blue" style="margin-top:9px" data-i18n="btn.mail" onclick="mailOpen()"></button>
<div class="grid2" style="margin-top:9px">
  <button class="b b-ghost" data-i18n="btn.backup" onclick="backup()"></button>
  <button class="b b-ghost" data-i18n="btn.restore" onclick="document.getElementById('fileIn').click()"></button>
</div>
<input type="file" id="fileIn" accept="application/json,.json" hidden onchange="restore(event)">
<button class="b b-red" style="margin-top:9px" data-i18n="btn.clear" onclick="clearAll()"></button>

<p class="tiny" id="footNote"></p>
<div class="verbox"><span id="verLine"></span></div>

<!-- ================= what did we read? ================= -->
<div class="modal" id="pickBox" hidden>
  <div class="modal-in">
    <h3 id="pickTitle"></h3>
    <p class="note" style="margin-top:0" id="pickHint"></p>
    <div class="rawtext" id="pickRaw"></div>
    <label style="margin-top:12px" data-i18n="pk.cands"></label>
    <div class="pchips" id="pickChips"></div>
    <label style="margin-top:10px" data-i18n="pk.edit"></label>
    <input type="text" id="pickIn" autocapitalize="characters" autocomplete="off" spellcheck="false">
    <button class="b b-blue" style="margin-top:11px" data-i18n="pk.save" onclick="pickSave()"></button>
    <button class="b b-ghost" style="margin-top:9px" data-i18n="pk.cancel" onclick="pickClose()"></button>
  </div>
</div>

<!-- ================= send by mail ================= -->
<div class="modal" id="mailBox" hidden>
  <div class="modal-in">
    <h3 data-i18n="ml.title"></h3>
    <div class="modal-sn" id="mailCount"></div>
    <label data-i18n="ml.to"></label>
    <input type="email" id="mailTo" data-i18n-ph="ml.toPh" autocomplete="email"
           inputmode="email" autocapitalize="off" spellcheck="false">
    <label style="margin-top:10px" data-i18n="ml.subj"></label>
    <input type="text" id="mailSubj" autocomplete="off">
    <div style="margin-top:12px">
      <label data-i18n="ml.which"></label>
      <div class="seg" id="segMailWho"></div>
    </div>
    <div style="margin-top:12px">
      <label data-i18n="ml.as"></label>
      <div class="seg" id="segMailWhat"></div>
    </div>
    <p class="note" id="mailNote"></p>
    <button class="b b-blue" style="margin-top:11px" id="mailGo" data-i18n="ml.go" onclick="mailSend()"></button>
    <button class="b b-ghost" style="margin-top:9px" data-i18n="pr.cancel" onclick="mailClose()"></button>
  </div>
</div>

<!-- ================= product editor ================= -->
<div class="modal" id="prodBox" hidden>
  <div class="modal-in">
    <h3 data-i18n="pr.title"></h3>
    <div class="modal-sn" id="prodSn"></div>
    <label data-i18n="pr.label"></label>
    <input type="text" id="prodIn" data-i18n-ph="pr.ph" autocomplete="off">
    <div class="pchips" id="prodChips"></div>
    <p class="note" id="prodNote"></p>
    <button class="b b-blue" style="margin-top:11px" data-i18n="pr.save" onclick="prodSave()"></button>
    <div class="grid2" style="margin-top:9px">
      <button class="b b-ghost" data-i18n="pr.auto" onclick="prodReset()"></button>
      <button class="b b-ghost" data-i18n="pr.cancel" onclick="prodClose()"></button>
    </div>
  </div>
</div>

<!-- ================= scanner ================= -->
<div class="scan" id="scanView" hidden>
  <video id="video" playsinline muted autoplay></video>
  <div class="mask">
    <div class="dim" id="dimTop"></div>
    <div class="dim" id="dimBot"></div>
    <div class="win" id="win"><i></i></div>
  </div>

  <div class="bar">
    <button class="icb" data-i18n="btn.close" onclick="closeScan()"></button>
    <div class="sp"></div>
    <button class="icb" id="btnLock" onclick="toggleLock()" aria-label="lock">🔓</button>
    <button class="icb" id="btnTorch" hidden onclick="toggleTorch()">🔦</button>
  </div>

  <div class="dupbox" id="dupBox" hidden>
    <div id="dupMsg"></div>
    <div class="g">
      <button class="yes" data-i18n="dup.add" onclick="dupAnswer(true)"></button>
      <button class="no" data-i18n="dup.skip" onclick="dupAnswer(false)"></button>
    </div>
  </div>

  <div class="foot">
    <div class="modeseg" id="segScanMode"></div>
    <button class="shoot" id="btnShoot" data-i18n="btn.shoot" onclick="shootText()" hidden></button>
    <div class="zoomrow" id="zoomRow" hidden>
      <span>🔍</span>
      <input type="range" id="zoom" min="1" max="5" step="0.1" value="1" oninput="setZoom(this.value)">
    </div>
    <p class="last" id="lastHit"></p>
    <p class="hint" id="scanHint"></p>
    <p class="cnt" id="scanCnt"></p>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";

var APP_VER="2026-09-16c";
var K_LIST="sn_items_v1", K_SET="sn_settings_v1", K_LANG="sn_lang", K_PROD="sn_products_v1";
var ZX_URL="https://cdn.jsdelivr.net/npm/zxing-wasm@2.1.2/+esm";
var XLSX_URL="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
/* 1D only: a serial-number sticker is never a QR code, and leaving the 2D
   formats out keeps the decoder fast and stops it grabbing the wrong label */
var FMT_1D=["Code128","Code39","Code93","Codabar","EAN-13","EAN-8","UPC-A","UPC-E","ITF"];
var FMT_2D=["QRCode","MicroQRCode","DataMatrix","Aztec","PDF417"];

  var el=document.getElementById("toast");
  el.textContent=m; el.classList.add("on");

function download(name,text,mime){
  var blob=(text instanceof Blob)?text:new Blob([text],{type:mime||"text/plain;charset=utf-8"});
  var url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },1500);
  toast(t("t.exported"));
}

/* ===================== transforms ===================== */
/* Z and Y sit swapped on a German keyboard, so a code typed through one comes
   out with them exchanged; the trim drops a fixed prefix the labels carry. */
function swapZY(s){
  return String(s).replace(/[yYzZ]/g,function(c){
    return c==="y"?"z":c==="z"?"y":c==="Y"?"Z":"Y";
  });
}
function transform(raw){
  var v=String(raw==null?"":raw);
  if(S.swap) v=swapZY(v);
  if(S.trim>0) v=v.slice(S.trim);
  return v.trim();
}

/* ===================== Hersteller-Erkennung =====================
   A serial number is the maker's own internal string: no public registry
   turns one into a product name, and nothing here goes online. What a serial
   DOES carry is the manufacturer's own format — its length, where the digits
   sit, the factory prefix — and those are distinctive enough to name the
   maker. Each rule carries a confidence:
     2 = the shape belongs to this maker alone
     1 = it fits, but another maker could produce the same shape (shown "?")
   Anything the rules cannot place stays empty rather than being invented. */
var VENDORS=[
  /* Cisco: 3 letters (site) + 4 digits (year/week) + 4 alnum = 11 */
  {v:"Cisco",c:2,re:/^[A-Z]{3}[0-9]{4}[0-9A-Z]{4}$/},
  /* Acer: 22 characters, starting with the model family code */
  {v:"Acer",c:2,re:/^(NX|NT|DT|UM|MM|ZX|EU)[0-9A-Z]{20}$/},
  /* Apple: 3-char factory/line code + 9 = 12 (serials up to 2020) */
  {v:"Apple",c:2,re:/^(C0|C1|C2|C3|C4|C6|C7|C8|CK|D2|DG|DK|DL|DM|DN|DP|DQ|DR|DT|DV|DX|DY|F1|F2|F4|F5|F7|F9|FV|G8|G9|GG|H0|H1|H2|H4|H9|RM|RN|SC|VM|W8|W9|YM)[0-9A-Z]{10}$/},
  /* Fujitsu: Y + 3 letters + 6 digits */
  {v:"Fujitsu",c:2,re:/^Y[A-Z]{3}[0-9]{6}$/},
  /* Brother: letter + 5 digits + letter + digit + letter + 6 digits */
  {v:"Brother",c:2,re:/^[A-Z][0-9]{5}[A-Z][0-9][A-Z][0-9]{6}$/},
  /* HP/HPE: 3 + 4 digits + 3, with a letter in the first and the last block
     — that letter check is what keeps a 10-digit code from becoming an HP */
  {v:"HP",c:2,re:/^(?=.{0,2}[A-Z])[0-9A-Z]{3}[0-9]{4}(?=.{0,2}[A-Z])[0-9A-Z]{3}$/},
  /* Lenovo: machine-type prefix + 6 = 8 */
  {v:"Lenovo",c:2,re:/^(PF|PC|PD|PG|R9|MP|MJ|YB|YD|S4|1S|EB|LR)[0-9A-Z]{6}$/},
  /* Dell Service Tag: exactly 7 alnum mixing letters and digits. Almost
     nothing else is 7 characters — but almost is not always. */
  {v:"Dell",c:1,re:/^(?=.*[0-9])(?=.*[A-Z])[0-9A-Z]{7}$/},
  /* Epson (Beamer, Drucker, Dokumentenkameras): letter + 3 + 6-7 digits */
  {v:"Epson",c:1,re:/^[A-Z][0-9A-Z]{3}[0-9]{6,7}$/},
  /* Microsoft Surface: 12 digits and nothing else */
  {v:"Microsoft",c:1,re:/^[0-9]{12}$/}
];
/* Deliberately not guessed: Samsung, ASUS, Zebra, Kyocera, Canon, BenQ and
   the rest. Their serials are ordinary 10-16 character strings that collide
   with everyone else's — in testing a rule for them fired on a third of all
   random codes. An empty field beats the wrong maker in an equipment list. */

/* An EAN/UPC is a PRODUCT code, not a serial. Its leading digits name the
   GS1 member organisation that issued it — the only thing readable offline. */
var GS1=[[0,19,"UPC (USA/Kanada)"],[30,39,"USA"],[40,44,"Deutschland"],[45,49,"Japan"],
 [50,59,"Großbritannien"],[60,69,"Südafrika"],[70,79,"Norwegen/Israel"],[80,83,"Italien"],
 [84,84,"Spanien"],[85,86,"Tschechien/Serbien"],[87,87,"Niederlande"],[88,88,"Südkorea"],
 [89,89,"Indien"],[90,91,"Österreich"],[93,93,"Australien"],[94,94,"Neuseeland"],
 [400,440,"Deutschland"],[450,459,"Japan"],[471,471,"Taiwan"],[489,489,"Hongkong"],
 [500,509,"Großbritannien"],[520,521,"Griechenland"],[539,539,"Irland"],
 [540,549,"Belgien/Luxemburg"],[560,560,"Portugal"],[569,569,"Island"],[570,579,"Dänemark"],
 [590,590,"Polen"],[594,594,"Rumänien"],[599,599,"Ungarn"],[600,601,"Südafrika"],
 [640,649,"Finnland"],[690,699,"China"],[700,709,"Norwegen"],[729,729,"Israel"],
 [730,739,"Schweden"],[754,755,"Kanada"],[760,769,"Schweiz"],[770,771,"Kolumbien"],
 [789,790,"Brasilien"],[800,839,"Italien"],[840,849,"Spanien"],[858,858,"Slowakei"],
 [859,859,"Tschechien"],[860,860,"Serbien"],[867,867,"Nordkorea"],[868,869,"Türkei"],
 [870,879,"Niederlande"],[880,880,"Südkorea"],[885,885,"Thailand"],[888,888,"Singapur"],
 [890,890,"Indien"],[893,893,"Vietnam"],[899,899,"Indonesien"],[900,919,"Österreich"],
 [930,939,"Australien"],[940,949,"Neuseeland"],[955,955,"Malaysia"],
 [977,977,"Zeitschrift"],[978,979,"Buch (ISBN)"],[981,984,"Gutschein"],[990,999,"Gutschein"]];
function gs1Country(code){
  var d=String(code).replace(/\D/g,"");
  if(d.length<8) return null;
  var p3=Number(d.slice(0,3)), p2=Number(d.slice(0,2)), i, g;
  /* the 3-digit ranges are the specific ones, so they have to win */
  for(i=0;i<GS1.length;i++){ g=GS1[i]; if(g[0]>=100&&p3>=g[0]&&p3<=g[1]) return g[2]; }
  for(i=0;i<GS1.length;i++){ g=GS1[i]; if(g[0]<100&&p2>=g[0]&&p2<=g[1]) return g[2]; }
  return null;
}
var EANFMT={"EAN-13":1,"EAN-8":1,"UPC-A":1,"UPC-E":1};
function guessVendor(sn,fmt){
  var s=String(sn==null?"":sn).trim();
  if(!s) return null;
  if(EANFMT[fmt]){               /* a retail code, not a serial — say so */
    var land=gs1Country(s);
    return {name:land?"EAN · "+land:"EAN",c:2};
  }
  var u=s.toUpperCase();
  for(var i=0;i<VENDORS.length;i++){
    if(VENDORS[i].re.test(u)) return {name:VENDORS[i].v,c:VENDORS[i].c};
  }
  return null;
}
/* A name typed by hand is remembered for that serial prefix, so the next
   device out of the same batch is filled in without being asked again. */
function prodKey(v){ return String(v||"").toUpperCase().slice(0,4); }
function productOf(x){
  if(x.prod) return {name:x.prod,src:"man"};
  var learned=prodMap[prodKey(x.value)];
  if(learned) return {name:learned,src:"learn"};
  var g=guessVendor(x.value,x.fmt);
  if(g) return {name:g.name,src:"auto",c:g.c};
  return null;
}
function productName(x){ var p=productOf(x); return p?p.name:""; }

/* ============ pulling a serial out of free text ============
   A QR code and a photographed label do not hand over a serial number — they
   hand over a URL, or four lines of small print. This turns that into a short
   list of candidates, best first.

   The vendor rules above earn their keep twice here: a token shaped like a
   known maker's serial is almost certainly the serial, and when the camera
   reads an O where the label prints a 0, trying the swap and watching it snap
   onto an unambiguous format is proof enough to offer the corrected reading. */
var SN_LABEL=/^\s*(s\s*[\/.\-]?\s*n|sn|serial\s*(no|nr|number)?|seriennummer|ser\s*[\.\-]?\s*no|geräte?nummer|device\s*id)\s*[:.\-=]?\s*/i;
var OTHER_LABEL=/^\s*(p\s*[\/.\-]?\s*n|part\s*(no|nr)?|model|modell|type|typ|mac|imei|art\s*[\.\-]?\s*nr|ean|ref)\s*[:.\-=]?\s*/i;
var PICK_SURE=60;          /* below this it is a suggestion, not an answer */

function vendorRule(s){
  var u=String(s).toUpperCase();
  for(var i=0;i<VENDORS.length;i++) if(VENDORS[i].re.test(u)) return VENDORS[i];
  return null;
}
var CONFUSE=[["O","0"],["0","O"],["I","1"],["1","I"],["L","1"],["S","5"],["5","S"],
             ["B","8"],["8","B"],["Z","2"],["2","Z"],["G","6"],["Q","0"]];
function repaired(s){
  if(vendorRule(s)) return null;                 /* already valid — leave it be */
  /* Only rewrite what the camera read when the token is ALREADY serial-shaped
     and the repair lands on a format that belongs to one maker alone. Without
     both guards a phone number becomes a "Dell service tag", and invented
     data in an equipment list is worse than no reading at all. */
  if(!/[A-Z]/.test(s)||!/[0-9]/.test(s)) return null;
  var seen={}, out=null, i, k, v, m;
  for(i=0;i<CONFUSE.length&&!out;i++){
    v=s.split(CONFUSE[i][0]).join(CONFUSE[i][1]);
    if(v!==s&&!seen[v]){ seen[v]=1; m=vendorRule(v); if(m&&m.c===2) out=v; }
  }
  if(out) return out;
  for(i=0;i<CONFUSE.length&&!out;i++){
    for(k=0;k<CONFUSE.length&&!out;k++){
      if(i===k) continue;
      v=s.split(CONFUSE[i][0]).join(CONFUSE[i][1]).split(CONFUSE[k][0]).join(CONFUSE[k][1]);
      if(v!==s&&!seen[v]){ seen[v]=1; m=vendorRule(v); if(m&&m.c===2) out=v; }
    }
  }
  return out;
}
function scoreToken(s,flagged,penalised){
  if(s.length<5||s.length>26) return -1;
  var digits=(s.match(/[0-9]/g)||[]).length;
  var alpha=(s.match(/[A-Za-z]/g)||[]).length;
  var upper=(s.match(/[A-Z]/g)||[]).length;
  if(s.length-digits-alpha>1) return -1;         /* punctuation-heavy */
  if(/[:+@]/.test(s)) return -1;                 /* a MAC, a phone, a time */
  if(!digits) return -1;                         /* every serial carries digits */
  var sc=0;
  if(vendorRule(s)) sc+=100;
  if(flagged) sc+=60;
  if(penalised) sc-=45;
  if(alpha&&digits) sc+=18;
  if(alpha&&upper===alpha) sc+=10;
  if(s.length>=7&&s.length<=18) sc+=12;
  if(/^[0-9]+$/.test(s)) sc-=12;
  if(/^[A-Za-z]+$/.test(s)) sc-=30;
  return sc;
}
function pickSerial(text){
  var raw=String(text==null?"":text).trim();
  if(!raw) return [];
  var cands=[];
  /* a URL keeps its payload in a named parameter or the last path piece */
  if(/^[a-z][a-z0-9+.\-]*:\/\//i.test(raw)||/^www\./i.test(raw)){
    var q=raw.split("?")[1]||"";
    q.split("&").forEach(function(kv){
      var k=(kv.split("=")[0]||"").toLowerCase(), v=kv.split("=").slice(1).join("=");
      if(/^(sn|s_n|serial|seriennummer|serialnumber|id|device|asset)$/.test(k)&&v){
        try{ v=decodeURIComponent(v); }catch(e){}
        cands.push({tok:v,flag:true,pen:false});
      }
    });
    var last=raw.split("?")[0].replace(/\/+$/,"").split("/").pop();
    if(last) cands.push({tok:last,flag:false,pen:false});
  }
  raw.split(/[\r\n]+/).forEach(function(line){
    var l=line.trim();
    if(!l) return;
    var flag=SN_LABEL.test(l), pen=!flag&&OTHER_LABEL.test(l);
    if(flag) l=l.replace(SN_LABEL,"");
    else if(pen) l=l.replace(OTHER_LABEL,"");
    l.split(/[\s,;|:=&?]+/).forEach(function(tok){
      tok=tok.replace(/^[^0-9A-Za-z]+|[^0-9A-Za-z\-]+$/g,"");
      if(tok) cands.push({tok:tok,flag:flag,pen:pen});
    });
  });
  var out=[], seen={};
  cands.forEach(function(c){
    var list=[[c.tok,false]], fix=repaired(c.tok.toUpperCase());
    if(fix) list.push([fix,true]);
    list.forEach(function(p){
      var v=p[0];
      if(seen[v]) return;
      var sc=scoreToken(v,c.flag,c.pen);
      if(sc<0) return;
      seen[v]=1;
      var ven=vendorRule(v);
      out.push({value:v,score:sc+(p[1]?3:0),fixed:p[1],vendor:ven?ven.v:null});
    });
  });
  out.sort(function(a,b){ return b.score-a.score; });
  return out.slice(0,6);
}

/* ===================== list ===================== */
function load(){
  items=lsGet(K_LIST,[]);
  prodMap=lsGet(K_PROD,{})||{};
  var s=lsGet(K_SET,null);
  if(s) for(var k in S) if(s[k]!==undefined) S[k]=s[k];
}
function save(){ lsSet(K_LIST,items); }
function saveSet(){ lsSet(K_SET,S); }
function saveProd(){ lsSet(K_PROD,prodMap); }
function isDup(v,skipId){
  return items.some(function(x){ return x.value===v&&x.id!==skipId; });
}
function addItem(raw,fmt,src){
  var v=transform(raw);
  if(!v) return null;
  var o={ id:uid(), raw:String(raw), value:v, ts:Date.now(), fmt:fmt||"" };
  /* what the QR code or the camera actually held, when a number was picked
     out of it — nothing the device told us is thrown away */
  if(src&&src!==String(raw)) o.src=String(src);
  o.dup=isDup(v);
  items.push(o); save(); render();
  return o;
}
window.delItem=function(id){
  var x=items.filter(function(y){ return y.id===id; })[0];
  if(!x) return;
  if(!confirm(t("c.delete",x.value))) return;
  items=items.filter(function(y){ return y.id!==id; });
  recheckDups(); save(); render(); toast(t("t.deleted"));
};
function recheckDups(){
  var seen={};
  items.forEach(function(x){
    x.dup=!!seen[x.value];
    seen[x.value]=1;
  });
}
window.reapply=function(){
  items.forEach(function(x){ x.value=transform(x.raw); });
  recheckDups(); save(); render();
  toast(t("t.reapplied",items.length));
};
/* ===================== product editor ===================== */
var prodId=null;
window.prodOpen=function(id){
  var x=items.filter(function(y){ return y.id===id; })[0];
  if(!x) return;
  prodId=id;
  document.getElementById("prodSn").textContent=x.value;
  var p=productOf(x);
  document.getElementById("prodIn").value=(p&&p.src!=="auto")?p.name:(p?p.name:"");
  /* offer what is already in the list first — those are this user's own
     device names — then the makers the rules know about */
  var used={}, order=[];
  items.forEach(function(y){ var n=productName(y);
    if(n&&n.indexOf("EAN")!==0&&!used[n]){ used[n]=1; order.push(n); } });
  VENDORS.forEach(function(v){ if(!used[v.v]){ used[v.v]=1; order.push(v.v); } });
  document.getElementById("prodChips").innerHTML=order.slice(0,14).map(function(n){
    return '<button type="button" data-n="'+esc(n)+'">'+esc(n)+"</button>"; }).join("");
  Array.prototype.forEach.call(document.getElementById("prodChips").querySelectorAll("button"),
    function(b){ b.onclick=function(){ document.getElementById("prodIn").value=b.getAttribute("data-n"); }; });
  document.getElementById("prodBox").hidden=false;
  document.body.classList.add("editing");
};
window.prodClose=function(){
  prodId=null;
  document.getElementById("prodBox").hidden=true;
  document.body.classList.remove("editing");
};
window.prodSave=function(){
  var x=items.filter(function(y){ return y.id===prodId; })[0];
  if(!x){ prodClose(); return; }
  var v=document.getElementById("prodIn").value.trim();
  if(!v){ prodReset(); return; }
  x.prod=v;
  prodMap[prodKey(x.value)]=v;   /* the same batch fills itself in next time */
  save(); saveProd(); render(); prodClose();
  toast(t("t.prodSet",v));
};
/* back to the automatic guess — and forget what this prefix had learned */
window.prodReset=function(){
  var x=items.filter(function(y){ return y.id===prodId; })[0];
  if(x){
    delete x.prod;
    delete prodMap[prodKey(x.value)];
    save(); saveProd(); render();
  }
  prodClose();
  toast(t("t.prodAuto"));
};

window.addManual=function(){
  var el=document.getElementById("manualIn");
  var v=el.value.trim();
  if(!v){ toast(t("t.needText")); return; }
  var o=addItem(v,"manual");
  el.value="";
  if(o) toast(t("t.added",o.value));
};
function render(){
  var box=document.getElementById("list");
  if(!items.length){
    box.innerHTML='<div class="empty">'+esc(t("list.empty"))+"</div>";
  }else{
    var rows=items.slice().reverse().map(function(x,i){
      var n=items.length-i;
      var meta=dstr(x.ts)+" "+tstr(x.ts);
      if(x.raw!==x.value) meta+=" · "+t("orig",x.raw);
      if(x.src) meta+=" · "+esc(t("src.from",x.src.length>34?x.src.slice(0,34)+"…":x.src));
      if(x.dup) meta+=" · <b>"+esc(t("st.dup"))+"</b>";
      var p=productOf(x), chip;
      if(!p) chip='<div class="prod none">'+esc(t("pr.unknown"))+"</div>";
      else chip='<div class="prod'+(p.src==="auto"?" guess":"")+'"><span class="nm">'+
        esc(p.name)+"</span>"+(p.src==="auto"&&p.c===1?"<span>?</span>":"")+"</div>";
      return '<div class="item'+(x.dup?" dup":"")+'">'+
        '<div class="no">'+n+"</div>"+
        '<div class="t" data-edit="'+esc(x.id)+'"><div class="sn">'+esc(x.value)+"</div>"+
        chip+'<div class="meta">'+meta+"</div></div>"+
        '<button class="x" data-id="'+esc(x.id)+'" aria-label="delete">✕</button></div>';
    }).join("");
    box.innerHTML=rows;
    Array.prototype.forEach.call(box.querySelectorAll(".x"),function(b){
      b.onclick=function(){ delItem(b.getAttribute("data-id")); };
    });
    Array.prototype.forEach.call(box.querySelectorAll("[data-edit]"),function(b){
      b.onclick=function(){ prodOpen(b.getAttribute("data-edit")); };
    });
  }
  var today=dstr(Date.now()), nToday=0, nDup=0;
  items.forEach(function(x){ if(dstr(x.ts)===today) nToday++; if(x.dup) nDup++; });
  document.getElementById("stTotal").textContent=items.length;
  document.getElementById("stToday").textContent=nToday;
  document.getElementById("stDup").textContent=nDup;
  document.getElementById("listInfo").textContent=items.length?String(items.length):"";
}

/* ===================== settings UI ===================== */
function segment(id,list,active,cb){
  var el=document.getElementById(id);
  if(!el) return;
  el.innerHTML=list.map(function(o){
    return '<button data-v="'+esc(String(o.v))+'"'+(String(o.v)===String(active)?' class="on"':"")+">"+esc(o.label)+"</button>";
  }).join("");
  Array.prototype.forEach.call(el.querySelectorAll("button"),function(b){
    b.onclick=function(){
      Array.prototype.forEach.call(el.querySelectorAll("button"),function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      cb(b.getAttribute("data-v"));
    };
  });
}
function trimExample(){
  var sample="YZ7-1024";
  document.getElementById("trimEx").textContent=t("trimEx",sample,transform(sample)||"—");
}
function buildSegments(){
  segment("segTrim",[{v:0,label:t("trim.0")},{v:1,label:t("trim.1")},
                     {v:2,label:t("trim.2")},{v:3,label:t("trim.3")}],S.trim,function(v){
    S.trim=parseInt(v,10); saveSet(); trimExample();
  });
  segment("segSwap",[{v:0,label:t("sw.off")},{v:1,label:t("sw.on")}],S.swap?1:0,function(v){
    S.swap=(v==="1"); saveSet(); trimExample();
  });
  segment("segDup",[{v:"warn",label:t("dup.warn")},{v:"skip",label:t("dup.skip")},
                    {v:"keep",label:t("dup.keep")}],S.dup,function(v){ S.dup=v; saveSet(); });
  segment("segBand",[{v:0.11,label:t("band.s")},{v:0.16,label:t("band.m")},
                     {v:0.24,label:t("band.l")}],S.band,function(v){
    S.band=parseFloat(v); saveSet(); applyLock();
  });
  segment("segBeep",[{v:1,label:t("on")},{v:0,label:t("off")}],S.beep?1:0,function(v){
    S.beep=(v==="1"); saveSet();
  });
  trimExample();
}

/* ===================== export ===================== */
function rows(list){
  return (list||items).map(function(x,i){
    return { no:i+1, sn:x.value, prod:productName(x), date:dstr(x.ts), time:tstr(x.ts),
             raw:(x.raw===x.value?"":x.raw), fmt:x.fmt||"" };
  });
}
function xlHead(){
  return [t("xl.no"),t("xl.sn"),t("xl.prod"),t("xl.date"),t("xl.time"),t("xl.raw"),t("xl.fmt")];
}
/* one builder per format, so the export buttons and the mail sheet cannot
   drift apart — whatever is downloaded is exactly what gets attached */
function csvText(list){
  var q=function(s){ return '"'+String(s==null?"":s).replace(/"/g,'""')+'"'; };
  var lines=["sep=;",xlHead().join(";")];
  rows(list).forEach(function(r){
    lines.push([r.no,q(r.sn),q(r.prod),q(r.date),q(r.time),q(r.raw),q(r.fmt)].join(";"));
  });
  return "﻿"+lines.join("\r\n");
}
function xlsxBlob(list){
  var ready=window.XLSX?Promise.resolve():loadScript(XLSX_URL);
  return ready.then(function(){
    if(!window.XLSX) throw new Error("nolib");
    var aoa=[xlHead()];
    rows(list).forEach(function(r){ aoa.push([r.no,r.sn,r.prod,r.date,r.time,r.raw,r.fmt]); });
    var ws=XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"]=[{wch:6},{wch:26},{wch:18},{wch:12},{wch:10},{wch:20},{wch:12}];
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Seriennummern");
    var out=XLSX.write(wb,{bookType:"xlsx",type:"array"});
    return new Blob([out],
      {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  });
}
function stamp(){ return dstr(Date.now()); }
window.exportCsv=function(){
  if(!items.length){ toast(t("t.noData")); return; }
  download("Seriennummern_"+stamp()+".csv",csvText(),"text/csv;charset=utf-8");
};
function loadScript(src){
  return new Promise(function(res,rej){
    var s=document.createElement("script");
    s.src=src; s.onload=function(){ res(); }; s.onerror=function(){ rej(new Error("load")); };
    document.head.appendChild(s);
  });
}
window.exportXlsx=function(){
  if(!items.length){ toast(t("t.noData")); return; }
  xlsxBlob().then(function(blob){
    download("Seriennummern_"+stamp()+".xlsx",blob);
  }).catch(function(){ toast(t("t.xlsxErr")); });
};
/* ===================== send by mail =====================
   Nothing is sent from the app itself — it hands the list to whatever mail
   account the phone already has. Two routes, because iOS only allows one of
   them to carry a real attachment:
     · the share sheet (navigator.share with a file) → Mail attaches the
       .xlsx/.csv properly, but no API may prefill the recipient;
     · mailto: → recipient and subject are prefilled, but the list has to
       travel as text in the body.
   The sheet picks the first when a file is attached and falls back to the
   second, so the user always ends up in their own Mail app. */
function mailScope(which){
  if(which==="today"){
    var d=dstr(Date.now());
    return items.filter(function(x){ return dstr(x.ts)===d; });
  }
  if(which==="new"){
    var since=S.mailLast||0;
    return items.filter(function(x){ return (x.ts||0)>since; });
  }
  return items.slice();
}
function mailBody(list){
  var L=[t("ml.bodyHead",list.length,dstr(Date.now())),""];
  list.forEach(function(x,i){
    var p=productName(x);
    L.push((i+1)+". "+x.value+(p?"  ·  "+p:"")+"  ·  "+dstr(x.ts));
  });
  var txt=L.join("\n");
  /* a mailto: URL that grows past a few thousand characters is silently
     dropped by iOS Mail, so the body is cut and the file offered instead */
  if(txt.length>1700){
    txt=txt.slice(0,1700).replace(/\n[^\n]*$/,"")+"\n\n"+t("ml.cut");
  }
  return txt+"\n";
}
window.mailOpen=function(){
  if(!items.length){ toast(t("t.noData")); return; }
  document.getElementById("mailTo").value=S.mailTo||"";
  document.getElementById("mailSubj").value=S.mailSubj||t("ml.subjDef",dstr(Date.now()));
  buildMailSegments();
  document.getElementById("mailBox").hidden=false;
  document.body.classList.add("editing");
};
window.mailClose=function(){
  document.getElementById("mailBox").hidden=true;
  document.body.classList.remove("editing");
};
var mailWhat="xlsx", mailWho="all";
function buildMailSegments(){
  segment("segMailWho",[
    {v:"all",label:t("ml.all",items.length)},
    {v:"today",label:t("ml.today",mailScope("today").length)},
    {v:"new",label:t("ml.new",mailScope("new").length)}
  ],mailWho,function(v){ mailWho=v; buildMailSegments(); });
  segment("segMailWhat",[
    {v:"xlsx",label:t("ml.xlsx")},{v:"csv",label:t("ml.csv")},{v:"text",label:t("ml.text")}
  ],mailWhat,function(v){ mailWhat=v; buildMailSegments(); });
  var n=mailScope(mailWho).length;
  document.getElementById("mailCount").textContent=t("ml.count",n);
  document.getElementById("mailGo").disabled=!n;
  document.getElementById("mailGo").style.opacity=n?"1":".45";
}
function mailtoGo(to,subj,body){
  var u="mailto:"+encodeURIComponent(to||"")+
        "?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(body);
  location.href=u;
}
window.mailSend=function(){
  var to=document.getElementById("mailTo").value.trim();
  var subj=document.getElementById("mailSubj").value.trim()||t("ml.subjDef",dstr(Date.now()));
  var list=mailScope(mailWho);
  if(!list.length){ toast(t("t.noData")); return; }
  /* whatever is typed here becomes the default for next time */
  S.mailTo=to; S.mailSubj=subj; saveSet();

  var done=function(){
    S.mailLast=Date.now(); saveSet();
    buildMailSegments();
    mailClose();
  };
  if(mailWhat==="text"){
    mailtoGo(to,subj,mailBody(list));
    done();
    return;
  }
  var name="Seriennummern_"+stamp()+(mailWhat==="csv"?".csv":".xlsx");
  var made=(mailWhat==="csv")
    ? Promise.resolve(new Blob([csvText(list)],{type:"text/csv;charset=utf-8"}))
    : xlsxBlob(list);
  made.then(function(blob){
    var file=null;
    try{ file=new File([blob],name,{type:blob.type}); }catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
      /* the share sheet cannot carry the address, so put it on the clipboard
         — one paste in the To: field and the mail is ready */
      var after=function(){
        return navigator.share({files:[file],title:subj,text:subj})
          .then(done,function(){ /* user cancelled: leave the sheet as it was */ });
      };
      if(to&&navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(to).then(function(){ toast(t("t.mailCopied",to)); },function(){});
      }
      return after();
    }
    /* no file sharing here: send the list as text and offer the file too */
    download(name,blob);
    mailtoGo(to,subj,mailBody(list)+"\n"+t("ml.attachNote",name));
    done();
  }).catch(function(){ toast(t("t.xlsxErr")); });
};

window.backup=function(){
  download("Scanner_Backup_"+stamp()+".json",
    JSON.stringify({v:2,app:"sn-scanner",exported:new Date().toISOString(),
      settings:S,products:prodMap,items:items},null,2),
    "application/json");
  toast(t("t.backupDone"));
};
window.restore=function(ev){
  var f=ev.target.files&&ev.target.files[0]; if(!f) return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var d=JSON.parse(fr.result);
      var arr=d.items||(Array.isArray(d)?d:null);
      if(!arr) throw new Error("bad");
      if(!confirm(t("c.restore"))) items=arr;
      else{
        var have={}; items.forEach(function(x){ have[x.id]=1; });
        arr.forEach(function(x){ if(!x.id) x.id=uid(); if(!have[x.id]) items.push(x); });
      }
      items.forEach(function(x){ if(x.value===undefined) x.value=transform(x.raw); });
      /* the learned product names travel with the backup */
      if(d.products) for(var k in d.products)
        if(Object.prototype.hasOwnProperty.call(d.products,k)) prodMap[k]=d.products[k];
      recheckDups(); save(); saveProd(); render(); toast(t("t.restored",arr.length));
    }catch(e){ toast(t("t.badFile")); }
    ev.target.value="";
  };
  fr.readAsText(f);
};
window.clearAll=function(){
  if(!items.length){ toast(t("t.noData")); return; }
  if(!confirm(t("c.clear",items.length))) return;
  items=[]; save(); render(); toast(t("t.cleared"));
};

/* ===================== scanner ===================== */
var zx=null, stream=null, track=null, scanning=false, scanTimer=null;
var lastVal="", lastAt=0, sessionCount=0, pendingDup=null;
var cnv=null, ctx=null, audioCtx=null;

function zxLib(){
  if(zx) return Promise.resolve(zx);
  return import(ZX_URL).then(function(m){ zx=m; return m; });
}
/* iOS Safari gives web apps no way to lock the orientation, so when the phone
   turns we draw the whole scanner rotated back — it looks and behaves exactly
   like a locked portrait screen. rotDeg also tells the decoder how to crop. */
var rotDeg=0;
function applyLock(){
  var el=document.getElementById("scanView");
  if(!el) return;
  rotDeg=0;
  el.style.transform=""; el.style.width=""; el.style.height="";
  el.style.left=""; el.style.top=""; el.style.right=""; el.style.bottom="";
  if(S.lock){
    var w=window.innerWidth, h=window.innerHeight;
    if(w>h){
      var a=(typeof window.orientation==="number")?window.orientation
            :((screen.orientation&&screen.orientation.angle)||90);
      rotDeg=(a===-90||a===270)?90:-90;
      el.style.width=h+"px"; el.style.height=w+"px";
      el.style.left=Math.round((w-h)/2)+"px"; el.style.top=Math.round((h-w)/2)+"px";
      el.style.right="auto"; el.style.bottom="auto";
      el.style.transform="rotate("+rotDeg+"deg)";
    }
  }
  var b=document.getElementById("btnLock");
  if(b){ b.classList.toggle("on",!!S.lock); b.textContent=S.lock?"🔒":"🔓"; }
  layoutMask();
}
function nativeLock(on){
  try{
    if(!window.screen||!screen.orientation) return;
    if(on&&screen.orientation.lock){ var p=screen.orientation.lock("portrait"); if(p&&p.catch) p.catch(function(){}); }
    else if(!on&&screen.orientation.unlock) screen.orientation.unlock();
  }catch(e){}
}
window.toggleLock=function(){
  S.lock=!S.lock; saveSet();
  nativeLock(S.lock);
  applyLock();
};
/* one description of the window, used both to draw it and to crop the frame,
   so what the decoder reads is exactly what the user framed */
function winRect(W,H){
  var m=S.scanMode, w, h;
  if(m==="qr"){ var side=Math.min(W*0.78,H*0.55); w=side; h=side; }      /* square */
  else if(m==="text"){ w=W*0.88; h=Math.max(90,H*0.34); }               /* a box  */
  else { w=W*0.88; h=Math.max(60,H*S.band); }                           /* a strip*/
  return {x:Math.round((W-w)/2),y:Math.round((H-h)/2),w:Math.round(w),h:Math.round(h)};
}
function layoutMask(){
  var win=document.getElementById("win");
  if(!win) return;
  var sv=document.getElementById("scanView");
  var W=(sv&&sv.clientWidth)||window.innerWidth;
  var H=(sv&&sv.clientHeight)||window.innerHeight;
  var r=winRect(W,H);
  win.style.left=r.x+"px"; win.style.top=r.y+"px";
  win.style.width=r.w+"px"; win.style.height=r.h+"px";
  win.classList.toggle("box",S.scanMode!=="bar");
}
function beep(){
  if(!S.beep) return;
  try{ if(navigator.vibrate) navigator.vibrate(40); }catch(e){}
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume();
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type="square"; o.frequency.value=1180;
    g.gain.setValueAtTime(0.0001,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.09,audioCtx.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.11);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+0.12);
  }catch(e){}
}
function setHint(k){ document.getElementById("scanHint").textContent=k?t(k):""; }
function setCount(){ document.getElementById("scanCnt").textContent=t("scan.cnt",sessionCount); }

window.openScan=function(){
  var note=document.getElementById("camNote");
  note.hidden=true;
  if(!window.isSecureContext){ note.textContent=t("cam.https"); note.hidden=false; return; }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    note.textContent=t("cam.none"); note.hidden=false; return;
  }
  document.getElementById("scanView").hidden=false;
  document.getElementById("lastHit").textContent="";
  sessionCount=0; setCount();
  setHint("scan.starting");
  buildModeSeg();
  document.getElementById("btnShoot").hidden=(S.scanMode!=="text");
  applyLock();
  /* the wasm engine and the camera can warm up at the same time */
  zxLib().catch(function(){ toast(t("t.libErr")); });
  navigator.mediaDevices.getUserMedia({
    video:{ facingMode:{ideal:"environment"},
            width:{ideal:1920}, height:{ideal:1080} },
    audio:false
  }).then(function(st){
    stream=st;
    track=st.getVideoTracks()[0];
    var v=document.getElementById("video");
    v.srcObject=st;
    var pr=v.play(); if(pr&&pr.catch) pr.catch(function(){});
    setupTrack();
    setHint("scan.loading");
    return zxLib();
  }).then(function(){
    if(S.scanMode==="text"){ setHint("scan.hintText"); return; }
    setHint(S.scanMode==="qr"?"scan.hintQr":"scan.hint");
    scanning=true;
    tickScan();
  }).catch(function(e){
    closeScan();
    var name=e&&e.name;
    note.textContent=(name==="NotAllowedError"||name==="SecurityError")?t("cam.denied"):t("cam.none");
    note.hidden=false;
  });
};
function setupTrack(){
  if(!track||!track.getCapabilities) return;
  var caps={};
  try{ caps=track.getCapabilities()||{}; }catch(e){}
  document.getElementById("btnTorch").hidden=!caps.torch;
  var zr=document.getElementById("zoomRow"), zi=document.getElementById("zoom");
  if(caps.zoom&&caps.zoom.max>caps.zoom.min){
    zr.hidden=false;
    zi.min=caps.zoom.min; zi.max=caps.zoom.max;
    zi.step=caps.zoom.step||0.1;
    zi.value=(track.getSettings&&track.getSettings().zoom)||caps.zoom.min;
  } else zr.hidden=true;
}
window.setZoom=function(v){
  if(!track) return;
  try{ track.applyConstraints({advanced:[{zoom:parseFloat(v)}]}); }catch(e){}
};
var torchOn=false;
window.toggleTorch=function(){
  if(!track) return;
  torchOn=!torchOn;
  document.getElementById("btnTorch").classList.toggle("on",torchOn);
  try{ track.applyConstraints({advanced:[{torch:torchOn}]}); }catch(e){}
};
window.closeScan=function(){
  scanning=false;
  if(scanTimer){ clearTimeout(scanTimer); scanTimer=null; }
  pendingDup=null;
  ocrStop();
  ocrBusy=false;
  document.getElementById("btnShoot").disabled=false;
  pickClose();
  document.getElementById("dupBox").hidden=true;
  try{ if(stream) stream.getTracks().forEach(function(tr){ tr.stop(); }); }catch(e){}
  stream=null; track=null; torchOn=false;
  var v=document.getElementById("video");
  try{ v.pause(); v.srcObject=null; }catch(e){}
  document.getElementById("btnTorch").classList.remove("on");
  nativeLock(false);
  rotDeg=0;
  var sv=document.getElementById("scanView");
  sv.style.transform=""; sv.style.width=""; sv.style.height="";
  sv.style.left=""; sv.style.top=""; sv.style.right=""; sv.style.bottom="";
  sv.hidden=true;
};
function tickScan(){
  if(!scanning) return;
  scanFrame().then(function(){
    if(scanning) scanTimer=setTimeout(tickScan,90);
  },function(){
    if(scanning) scanTimer=setTimeout(tickScan,250);
  });
}
function scanFrame(){
  if(pendingDup||S.scanMode==="text") return Promise.resolve();
  if(!document.getElementById("pickBox").hidden) return Promise.resolve();
  var v=document.getElementById("video");
  if(!v||v.readyState<2||!v.videoWidth) return Promise.resolve();
  cnv=cnv||document.createElement("canvas");
  ctx=ctx||cnv.getContext("2d",{willReadFrequently:true});
  /* only the strip inside the window is decoded: faster, and it cannot pick up
     a neighbouring label that happens to be in the frame */
  var vw=v.videoWidth, vh=v.videoHeight;
  /* with the screen locked the frame is shown turned, so the strip the user
     sees is a different slice of the raw frame — rotate first, then crop */
  var swap=(rotDeg===90||rotDeg===-90);
  var dw=swap?vh:vw, dh=swap?vw:vh;
  var r=winRect(dw,dh);
  var bx=r.x, by=r.y, bw=r.w, bh=r.h;
  if(cnv.width!==bw||cnv.height!==bh){ cnv.width=bw; cnv.height=bh; }
  ctx.save();
  ctx.translate(-bx,-by);
  ctx.translate(dw/2,dh/2);
  if(rotDeg) ctx.rotate(rotDeg*Math.PI/180);
  ctx.drawImage(v,-vw/2,-vh/2);
  ctx.restore();
  var data;
  try{ data=ctx.getImageData(0,0,bw,bh); }catch(e){ return Promise.resolve(); }
  return zx.readBarcodes(data,{formats:fmtList(),tryHarder:true,maxNumberOfSymbols:1})
    .then(function(res){ if(res&&res.length) onHit(res[0]); });
}
function onHit(res){
  var raw=String(res.text||"").trim();
  if(!raw) return;
  var now=Date.now();
  if(raw===lastVal&&now-lastAt<1800) return;
  lastVal=raw; lastAt=now;
  /* a QR code rarely holds the bare number — it holds a link or a whole
     label. Pull the serial out of it, and ask when the reading is not clear */
  var payload=null;
  if(S.scanMode==="qr"){
    var picks=pickSerial(raw);
    if(!picks.length||picks[0].score<PICK_SURE){
      beep();
      openPick(raw,picks,"qr");
      return;
    }
    if(picks[0].value!==raw){ payload=raw; raw=picks[0].value; }
  }
  var v=transform(raw);
  if(!v) return;
  if(isDup(v)){
    if(S.dup==="skip"){ beep(); toast(t("t.skipped")); return; }
    if(S.dup==="warn"){
      pendingDup={raw:raw,fmt:res.format||"",src:payload};
      document.getElementById("dupMsg").textContent=t("dup.msg",v);
      document.getElementById("dupBox").hidden=false;
      beep();
      return;
    }
  }
  commit(raw,res.format||"",payload);
}
function commit(raw,fmt,src){
  var o=addItem(raw,fmt,src);
  if(!o) return;
  sessionCount++; setCount();
  document.getElementById("lastHit").textContent="✓ "+o.value;
  beep();
}
/* ===================== scan mode ===================== */
function buildModeSeg(){
  segment("segScanMode",[
    {v:"bar",label:t("sm.bar")},{v:"qr",label:t("sm.qr")},{v:"text",label:t("sm.text")}
  ],S.scanMode,function(v){ setScanMode(v); });
}
function setScanMode(m){
  S.scanMode=m; saveSet();
  lastVal="";
  document.getElementById("btnShoot").hidden=(m!=="text");
  document.getElementById("lastHit").textContent="";
  layoutMask();
  if(m==="text"){
    scanning=false;
    if(scanTimer){ clearTimeout(scanTimer); scanTimer=null; }
    setHint("scan.hintText");
  }else if(stream){
    setHint(m==="qr"?"scan.hintQr":"scan.hint");
    if(!scanning){ scanning=true; tickScan(); }
  }
}

/* ===================== text scan (OCR) =====================
   Reading a label with the camera is a photo, not a video: recognition takes
   the better part of a second, so it runs once on a frame the user chose
   rather than on every frame. The result is never written in silently — the
   candidates are offered and the user confirms one. */
var ocrWorker=null, ocrBusy=false;
function ocrLib(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  return loadScript(OCR_JS).then(function(){
    if(!window.Tesseract) throw new Error("nolib");
    return window.Tesseract;
  });
}
function ocrReady(){
  if(ocrWorker) return Promise.resolve(ocrWorker);
  return ocrLib().then(function(T){
    return T.createWorker("eng",1,{
      workerPath:OCR_WORKER, corePath:OCR_CORE, langPath:OCR_LANG,
      logger:function(m){
        if(m&&m.status&&/load|initial|recogn/i.test(m.status)){
          var pct=m.progress?" "+Math.round(m.progress*100)+"%":"";
          document.getElementById("scanHint").textContent=t("ocr.working")+pct;
        }
      }
    });
  }).then(function(w){ ocrWorker=w; return w; });
}
function ocrStop(){
  if(!ocrWorker) return;
  try{ ocrWorker.terminate(); }catch(e){}
  ocrWorker=null;
}
window.shootText=function(){
  if(ocrBusy) return;
  var v=document.getElementById("video");
  if(!v||v.readyState<2||!v.videoWidth){ toast(t("t.noFrame")); return; }
  ocrBusy=true;
  var btn=document.getElementById("btnShoot");
  btn.disabled=true;
  setHint("ocr.loading");
  /* grab exactly the window the user framed, upscaled — small text on a
     phone frame is the single biggest cause of a bad reading */
  var swap=(rotDeg===90||rotDeg===-90);
  var vw=v.videoWidth, vh=v.videoHeight;
  var dw=swap?vh:vw, dh=swap?vw:vh;
  var r=winRect(dw,dh);
  var scale=Math.min(3,Math.max(1,1400/r.w));
  var c=document.createElement("canvas");
  c.width=Math.round(r.w*scale); c.height=Math.round(r.h*scale);
  var cx=c.getContext("2d");
  cx.save();
  cx.scale(scale,scale);
  cx.translate(-r.x,-r.y);
  cx.translate(dw/2,dh/2);
  if(rotDeg) cx.rotate(rotDeg*Math.PI/180);
  cx.drawImage(v,-vw/2,-vh/2);
  cx.restore();
  /* grey + contrast: the recogniser does markedly better on clean strokes */
  try{
    var img=cx.getImageData(0,0,c.width,c.height), d=img.data;
    for(var i=0;i<d.length;i+=4){
      var g=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114);
      g=(g-128)*1.35+128;
      g=g<0?0:g>255?255:g;
      d[i]=d[i+1]=d[i+2]=g;
    }
    cx.putImageData(img,0,0);
  }catch(e){}

  ocrReady().then(function(w){
    setHint("ocr.working");
    return w.recognize(c);
  }).then(function(res){
    var txt=(res&&res.data&&res.data.text)||"";
    beep();
    openPick(txt.trim(),pickSerial(txt),"ocr");
  }).catch(function(){
    toast(t("t.ocrErr"));
  }).then(function(){
    ocrBusy=false;
    btn.disabled=false;
    setHint("scan.hintText");
  });
};

/* ===================== the reading confirmation ===================== */
var pickSrc="qr", pickRawText="";
function openPick(raw,cands,src){
  pickSrc=src;
  document.getElementById("pickTitle").textContent=t(src==="ocr"?"pk.titleOcr":"pk.titleQr");
  document.getElementById("pickHint").textContent=t(src==="ocr"?"pk.hintOcr":"pk.hintQr");
  pickRawText=raw||"";
  document.getElementById("pickRaw").textContent=raw||t("pk.nothing");
  var box=document.getElementById("pickChips");
  box.innerHTML=(cands||[]).map(function(c,i){
    return '<button type="button"'+(i===0?' class="top"':'')+' data-v="'+esc(c.value)+'">'+
      esc(c.value)+
      (c.vendor?'<span class="vd">'+esc(c.vendor)+"</span>":"")+
      (c.fixed?'<span class="fx">'+esc(t("pk.fixed"))+"</span>":"")+"</button>";
  }).join("")||'<span class="note" style="margin:0">'+esc(t("pk.none"))+"</span>";
  Array.prototype.forEach.call(box.querySelectorAll("button"),function(b){
    b.onclick=function(){ document.getElementById("pickIn").value=b.getAttribute("data-v"); };
  });
  document.getElementById("pickIn").value=(cands&&cands.length)?cands[0].value:"";
  document.getElementById("pickBox").hidden=false;
  document.body.classList.add("editing");
}
window.pickClose=function(){
  document.getElementById("pickBox").hidden=true;
  document.body.classList.remove("editing");
  lastAt=Date.now();
};
window.pickSave=function(){
  var v=document.getElementById("pickIn").value.trim();
  if(!v){ toast(t("t.needText")); return; }
  var val=transform(v);
  if(isDup(val)&&S.dup!=="keep"){
    if(!confirm(t("dup.msg",val)+"\n\n"+t("dup.add")+"?")){ pickClose(); return; }
  }
  var o=addItem(v,pickSrc==="ocr"?"OCR":"QR",pickRawText);
  pickClose();
  if(o){
    sessionCount++; setCount();
    document.getElementById("lastHit").textContent="✓ "+o.value;
    beep();
    toast(t("t.added",o.value));
  }
};

window.dupAnswer=function(yes){
  var p=pendingDup; pendingDup=null;
  document.getElementById("dupBox").hidden=true;
  if(!p) return;
  if(yes) commit(p.raw,p.fmt,p.src);
  else toast(t("t.skipped"));
  lastAt=Date.now();
};

/* ===================== update check ===================== */
var lastUpdCheck=0;
function checkUpdate(){
  if(location.protocol==="file:") return;
  if(Date.now()-lastUpdCheck<300000) return;
  lastUpdCheck=Date.now();
  fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"})
    .then(function(r){ return r.ok?r.text():null; })
    .then(function(txt){
      if(!txt) return;
      var m=txt.match(/APP_VER="([^"]+)"/);
      if(!m||!m[1]||m[1]===APP_VER) return;
      document.getElementById("updVer").textContent="v"+m[1];
      document.getElementById("updBar").hidden=false;
    })
    .catch(function(){});
}
window.doUpdate=function(){
  var go=function(){ location.replace(location.pathname+"?v="+Date.now()); };
  if(window.caches&&caches.keys){
    caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })
      .then(go,go);
  } else go();
};

/* ===================== language ===================== */
window.setLang=function(l){
  if(l!==lang){ lang=l; try{ localStorage.setItem(K_LANG,l); }catch(e){} }
  applyLang();
};
function applyLang(){
  document.documentElement.setAttribute("lang",lang);
  document.getElementById("langKo").classList.toggle("on",lang==="ko");
  document.getElementById("langDe").classList.toggle("on",lang==="de");
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"),function(el){
    el.textContent=t(el.getAttribute("data-i18n"));
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-ph]"),function(el){
    el.setAttribute("placeholder",t(el.getAttribute("data-i18n-ph")));
  });
  document.getElementById("footNote").innerHTML=t("foot.note");
  document.getElementById("prodNote").innerHTML=t("pr.note");
  document.getElementById("mailNote").innerHTML=t("ml.note");
  if(!document.getElementById("mailBox").hidden) buildMailSegments();
  document.getElementById("verLine").textContent=t("ver.label")+" v"+APP_VER;
  document.getElementById("dupBox").querySelector(".yes").textContent=t("dup.add");
  document.getElementById("dupBox").querySelector(".no").textContent=t("dup.skip2");
  buildSegments();
  render();
  if(!document.getElementById("scanView").hidden) buildModeSeg();
  if(scanning) setHint(S.scanMode==="qr"?"scan.hintQr":"scan.hint");
}

/* ===================== init ===================== */
(function init(){
  var sl=null; try{ sl=localStorage.getItem(K_LANG); }catch(e){}
  if(sl==="ko"||sl==="de") lang=sl;
  else lang=(navigator.language||"").toLowerCase().indexOf("ko")===0?"ko":"de";
  load();
  applyLang();
  checkUpdate();
  window.addEventListener("resize",applyLock);
  window.addEventListener("orientationchange",function(){ setTimeout(applyLock,320); });
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden) checkUpdate();
    if(document.hidden&&scanning) closeScan();
  });
})();
})();
